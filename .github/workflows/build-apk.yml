name: Build Theme APK

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Unique build identifier'
        required: true

jobs:
  build:
    name: "build-${{ inputs.build_id }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download theme ZIP from Worker
        run: |
          curl -f -o theme-project.zip "https://ktheme-build-worker.flowtrace.workers.dev/r2/builds/${{ inputs.build_id }}.zip"

      - name: Extract project
        run: |
          mkdir -p build-project
          cd build-project
          unzip ../theme-project.zip

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: build-project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: "apk-${{ inputs.build_id }}"
          path: build-project/build/outputs/apk/debug/*.apk
          retention-days: 1
